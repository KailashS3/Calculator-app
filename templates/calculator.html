<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>
    <h2>Calculator</h2>
    <form action="/calculate" method="post">
        <input type="number" name="a" step="any" required>
        <select name="op">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input type="number" name="b" step="any" required>
        <button type="submit">Calculate</button>
    </form>
</body>
</html>
